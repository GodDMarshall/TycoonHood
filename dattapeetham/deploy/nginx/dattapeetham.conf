# Avadhoota Datta Peetham website: nginx.
# Generated by tools/server-configs.mjs from deploy/routes.mjs (v1.0.0).
# Do not edit by hand: change deploy/routes.mjs or site.config.json, then run
#   node tools/server-configs.mjs site
# (the build runs it too).
#
#   site:             https://www.dattapeetham.org
#   legacy platform:  https://www.dattapeetham.org  (same host: no platform redirects, they would loop)
#
# Install: copy the built site/ folder to the root below, put this file in
# /etc/nginx/conf.d/ (it belongs inside the http {} block), set the
# certificate paths on the lines marked [tls], run `nginx -t`, reload.
# Needs nginx 1.11.8+ (absolute_redirect). For nginx 1.25.1+ you may replace
# "listen 443 ssl http2" with "listen 443 ssl" plus "http2 on;".
# Delete the lines marked [ipv6] if the server has no IPv6 (nginx will not
# start: "socket() [::]:80 failed (97: Address family not supported)").

# Cache-Control by request path: first match wins.
map $uri $dp_cache_control {
    default "no-cache";
    "~*^/assets/.+\.(?:css|js|mjs)$" "public, max-age=31536000, immutable";  # versioned code
    "~*^/assets/.+\.(?:webp|avif|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|otf)$" "public, max-age=2592000";  # media
}

# ==== BEGIN canonical host and HTTPS ==========================================
# http:// for both names, and https://dattapeetham.org, go to https://www.dattapeetham.org.
# To serve without TLS (e.g. behind a proxy that ends TLS), delete this block
# and give the main server below "listen 80;".
server {
    listen 80;
    listen [::]:80;  # [ipv6]
    server_name www.dattapeetham.org dattapeetham.org;
    root /var/www/dattapeetham/site;
    server_tokens off;
    # ACME (Let's Encrypt) HTTP-01 challenges must stay reachable over http.
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://www.dattapeetham.org$request_uri; }
}
server {                                                       # [tls]
    listen 443 ssl http2;                                      # [tls]
    listen [::]:443 ssl http2;                                 # [tls] [ipv6]
    server_name dattapeetham.org;                               # [tls]
    ssl_certificate     /etc/ssl/dattapeetham/fullchain.pem;   # [tls] your certificate (both names)
    ssl_certificate_key /etc/ssl/dattapeetham/privkey.pem;     # [tls]
    server_tokens off;                                         # [tls]
    return 301 https://www.dattapeetham.org$request_uri;          # [tls]
}                                                              # [tls]
# ==== END canonical host and HTTPS ============================================

server {
    listen 443 ssl http2;                                      # [tls]
    listen [::]:443 ssl http2;                                 # [tls] [ipv6]
    server_name www.dattapeetham.org;                           # [server-name]
    ssl_certificate     /etc/ssl/dattapeetham/fullchain.pem;   # [tls] your certificate
    ssl_certificate_key /etc/ssl/dattapeetham/privkey.pem;     # [tls]
    ssl_protocols TLSv1.2 TLSv1.3;                             # [tls]
    ssl_session_cache shared:dattapeetham_tls:10m;             # [tls]
    ssl_session_timeout 1d;                                    # [tls]
    ssl_session_tickets off;                                   # [tls]

    root /var/www/dattapeetham/site;
    index index.html;
    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript text/javascript application/json application/manifest+json image/svg+xml;
    server_tokens off;
    autoindex off;
    # Relative Location headers: right behind any proxy or port mapping.
    absolute_redirect off;
    error_page 404 /404.html;
    error_page 403 =404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json application/xml text/xml image/svg+xml text/plain;
    # With the ngx_brotli module installed, also:
    # brotli on; brotli_comp_level 5;
    # brotli_types text/css text/javascript application/javascript application/json application/manifest+json application/xml text/xml image/svg+xml text/plain;

    # Headers for every response (no location below sets add_header, so
    # these are never dropped by nginx's add_header inheritance).
    add_header Cache-Control $dp_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' mailto:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://dattapeetham.s3.amazonaws.com https://dev-dattapeetham.s3.amazonaws.com https://i.ytimg.com; frame-src https://www.youtube-nocookie.com https://www.google.com; connect-src 'self'; upgrade-insecure-requests" always;

    # Hidden files (except /.well-known/) and the other servers' config files.
    location ~ "/\.(?!well-known(?:/|$))" { return 404; }
    location ~ "^/(?:_headers|_redirects|web\.config)$" { return 404; }

    # Old-site URLs → new pages (301, query string kept).
    location = /sriswamiji { return 301 "/sri-swamiji.html$is_args$args"; }
    location = /page/view/sri-swamiji { return 301 "/sri-swamiji.html$is_args$args"; }
    location = /page/view/sri-ganapathy-sachchidananda-swamiji { return 301 "/sri-swamiji.html$is_args$args"; }
    location = /page/view/sri-bala-swamiji { return 301 "/sri-swamiji.html$is_args$args#bala-swamiji"; }
    location = /page/view/sri-swamijis-avatara-timeline { return 301 "/sri-swamiji.html$is_args$args#timeline"; }
    location = /page/view/awards-honors { return 301 "/sri-swamiji.html$is_args$args#honours"; }
    location = /page/view/datta-peetha-guru-parampara { return 301 "/guru-parampara.html$is_args$args"; }
    location = /page/view/adi-guru-dattatreya { return 301 "/guru-parampara.html$is_args$args#dattatreya"; }
    location = /page/view/datta-avadhoota { return 301 "/centers.html$is_args$args#kshetras"; }
    location = /page/view/sri-jayalakshmi-maata { return 301 "/guru-parampara.html$is_args$args#jayalakshmi-maata"; }
    location = /dattapeetham { return 301 "/about.html$is_args$args"; }
    location = /page/view/about-us { return 301 "/about.html$is_args$args"; }
    location = /page/view/ashram-life { return 301 "/about.html$is_args$args#ashram-life"; }
    location = /page/view/ashram-shrines { return 301 "/darshan.html$is_args$args"; }
    location = /page/view/kaalaagni-shamana-dattatreya { return 301 "/darshan.html$is_args$args#prayer-hall"; }
    location = /page/view/rajarajeshwari-temple { return 301 "/darshan.html$is_args$args#rajarajeshwari"; }
    location = /page/view/sri-datta-venkateshwara-temple { return 301 "/darshan.html$is_args$args#venkateshwara"; }
    location = /page/view/karya-siddhi-hanuman-temple { return 301 "/darshan.html$is_args$args#hanuman"; }
    location = /page/view/shuka-vana { return 301 "/attractions.html$is_args$args#shuka-vana"; }
    location = /page/view/bonsai-garden { return 301 "/attractions.html$is_args$args#bonsai"; }
    location = /page/view/vishwam-museum { return 301 "/attractions.html$is_args$args#vishwam"; }
    location = /page/view/nada-mantapa { return 301 "/attractions.html$is_args$args#nada-mantapa"; }
    location = /page/view/sgs-hospital { return 301 "/seva.html$is_args$args#hospital"; }
    location = /page/view/sgs-veda-pathashala { return 301 "/seva.html$is_args$args#pathashala"; }
    location = /page/view/social-activities { return 301 "/seva.html$is_args$args"; }
    location = /page/view/contribution-towards-nature { return 301 "/seva.html$is_args$args#nature"; }
    location = /page/view/sdhs-volunteers { return 301 "/seva.html$is_args$args#volunteer"; }
    location = /page/view/bhajans-and-healing-music { return 301 "/music.html$is_args$args"; }
    location = /page/view/datta-kriya-yoga { return 301 "/kriya-yoga.html$is_args$args"; }
    location = /page/view/datta-kriya-yoga-international-center { return 301 "/kriya-yoga.html$is_args$args#dkyic"; }
    location = /page/view/guidelines-for-visitors { return 301 "/visit.html$is_args$args#guidelines"; }
    location = /page/view/devotee-etiquette { return 301 "/visit.html$is_args$args#etiquette"; }
    location = /page/view/datta-peetham-glossary { return 301 "/teachings.html$is_args$args#glossary"; }
    location = /page/view/literary-contributions { return 301 "/teachings.html$is_args$args#literature"; }
    location = /page/view/sanatana-dharma-parirakshana { return 301 "/teachings.html$is_args$args"; }
    location = /page/view/ask-dattaji { return 301 "/teachings.html$is_args$args#ask-dattaji"; }
    location = /page/view/social-media-pages { return 301 "/media.html$is_args$args#social"; }
    location = /page/view/dattapeetham-telecast-timing-of-sri-swamijis-programs { return 301 "/events.html$is_args$args#tv"; }
    location = /shodasha-datta-kshetras { return 301 "/centers.html$is_args$args#kshetras"; }
    location = /navanatha-datta-kshetras { return 301 "/centers.html$is_args$args#navanatha"; }
    location = /ashrams/avadhoota-datta-peetham-mysore-main { return 301 "/centers.html$is_args$args#mysuru"; }

    # Page URLs without .html → the canonical .html URL.
    location ~ "^/((?:(?:kn|hi|ta|te)/)?)index$" { return 301 "/$1$is_args$args"; }
    location ~ "^/(kn|hi|ta|te)$" { return 301 "/$1/$is_args$args"; }
    location ~ "^(/(?:(?:kn|hi|ta|te)/)?(?:about|attractions|centers|contact|darshan|events|guru-parampara|kriya-yoga|media|music|seva|sri-swamiji|teachings|visit))$" { return 301 "$1.html$is_args$args"; }

    # Platform paths: none. The platform shares this host; see site.config.json.

    # MIME types older mime.types files lack or get wrong.
    location ~* "\.webmanifest$" { types { } default_type application/manifest+json; try_files $uri =404; }
    location ~* "\.webp$" { types { } default_type image/webp; try_files $uri =404; }
    location ~* "\.json$" { types { } default_type application/json; try_files $uri =404; }
    location ~* "\.svg$" { types { } default_type image/svg+xml; try_files $uri =404; }
    location ~* "\.woff2$" { types { } default_type font/woff2; try_files $uri =404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
