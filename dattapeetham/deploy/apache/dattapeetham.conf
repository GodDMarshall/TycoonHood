# Avadhoota Datta Peetham website: the Apache 2.4 server side.
#
# On cPanel and most shared hosting this is already done for you: upload the
# contents of site/ (including the hidden .htaccess) to public_html and stop
# here. This file documents what the .htaccess expects from the server, for a
# VPS or a host you configure yourself. It is also the configuration
# deploy/test/docker-servers.mjs tests with httpd:2.4.
#
# Include it from httpd.conf (Include conf/extra/dattapeetham.conf) or drop it
# in /etc/apache2/sites-available/ (Debian/Ubuntu: a2enmod rewrite headers
# expires deflate, then a2ensite dattapeetham).

# ---- modules the .htaccess uses (paths are those of the official httpd image;
#      Debian/Ubuntu load modules with a2enmod instead) -------------------------
<IfModule !rewrite_module>
  LoadModule rewrite_module modules/mod_rewrite.so
</IfModule>
<IfModule !headers_module>
  LoadModule headers_module modules/mod_headers.so
</IfModule>
<IfModule !expires_module>
  LoadModule expires_module modules/mod_expires.so
</IfModule>
<IfModule !filter_module>
  LoadModule filter_module modules/mod_filter.so
</IfModule>
<IfModule !deflate_module>
  LoadModule deflate_module modules/mod_deflate.so
</IfModule>

# ---- the document root: .htaccess must be allowed to override -------------
Define DP_ROOT "/var/www/dattapeetham/site"

<Directory "${DP_ROOT}">
  Options -Indexes +SymLinksIfOwnerMatch
  AllowOverride All
  Require all granted
</Directory>

# ---- http (also answers the canonical-host and HTTPS redirects) ------------
<VirtualHost *:80>
  ServerName www.dattapeetham.org
  ServerAlias dattapeetham.org
  DocumentRoot "${DP_ROOT}"
  # Uncomment to switch off the .htaccess canonical-host/HTTPS block, e.g. on
  # a staging server answering to the real name over plain http:
  # SetEnvIf Request_URI "^" DP_CANONICAL=off
</VirtualHost>

# ---- https: set your certificate paths, then it switches itself on ----------
# (Apache must also "Listen 443": Debian's ports.conf and the httpd image's
# extra/httpd-ssl.conf do.)
<IfModule ssl_module>
  <IfFile "/etc/ssl/dattapeetham/fullchain.pem">
    <VirtualHost *:443>
      ServerName www.dattapeetham.org
      ServerAlias dattapeetham.org
      DocumentRoot "${DP_ROOT}"
      SSLEngine on
      SSLCertificateFile    "/etc/ssl/dattapeetham/fullchain.pem"
      SSLCertificateKeyFile "/etc/ssl/dattapeetham/privkey.pem"
      Protocols h2 http/1.1
    </VirtualHost>
  </IfFile>
</IfModule>
