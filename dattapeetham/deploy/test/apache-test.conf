# Test-only Apache settings for deploy/test/docker-servers.mjs. Not for
# production.

ServerName localhost

# Imitate a shared host that sets a cache policy for everyone. The site's
# .htaccess must neutralise it (one Cache-Control value, no Expires).
<IfModule expires_module>
  ExpiresActive On
  ExpiresDefault "access plus 1 month"
  ExpiresByType text/html "access plus 1 hour"
</IfModule>

# A request header that switches the .htaccess canonical-host/HTTPS block
# off, so verify-server.mjs can prove the switch works.
SetEnvIf X-DP-Canonical "^off$" DP_CANONICAL=off
