name: verify

# Every push and PR proves the gates that run locally, on a database built
# from zero the way a production deploy builds it. If this is green, the
# platform assembles cleanly on a machine that has never seen it before.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tycoon
          POSTGRES_PASSWORD: tycoon_ci
          POSTGRES_DB: tycoonhood_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://tycoon:tycoon_ci@localhost:5432/tycoonhood_test
      # A throwaway database, so the seed may use the public development admin.
      ALLOW_DEFAULT_ADMIN: "1"
      # Deliberately unset: RAZORPAY_*, RESEND_API_KEY, DISCORD_*.
      # CI must prove the platform runs correctly with integrations absent.

    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from package.json ("packageManager").
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The same engine-free runner a production deploy uses (scripts/vercel-build.sh).
      - name: Apply migrations
        run: pnpm db:migrate:sql

      - name: Seed, in the order a first deploy uses
        run: |
          pnpm db:seed
          pnpm db:seed:academy
          pnpm db:seed:content
          pnpm --filter @tycoonhood/db seed:shop
          pnpm --filter @tycoonhood/db seed:community

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build (web + miner)
        run: pnpm build

      - name: three.js stays out of every route bundle
        run: node scripts/world/check-bundle.mjs

      - name: Assert no placeholder content reached the seeded academy
        run: |
          COUNT=$(psql "$DATABASE_URL" -t -A -c \
            "select count(*) from \"Lesson\" where \"contentMd\" like '%Content pending%';")
          echo "placeholder lessons: $COUNT"
          test "$COUNT" -eq 0
